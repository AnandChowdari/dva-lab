[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dva-lab"
version = "0.2.1"
description = "A cloud-synchronized Python package for Data Visualization and Analytics (DVA) experiments in Jupyter Notebook and Python."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Anand Chowdari", email = "anandchowdari@example.com" }
]
keywords = [
    "data-visualization",
    "analytics",
    "dva",
    "dva-lab",
    "jupyter",
    "matplotlib",
    "seaborn",
    "powerbi",
    "olap",
    "sql",
    "dax",
    "education",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Framework :: Jupyter",
    "Framework :: IPython",
]
dependencies = []

[project.optional-dependencies]
viz = [
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
    "seaborn>=0.12.0",
    "scipy>=1.7.0",
    "statsmodels>=0.13.0",
]
full = [
    "dva-lab[viz]",
    "pandas>=1.3.0",
    "ipython>=8.0.0",
]
test = [
    "pytest>=7.0.0",
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
    "seaborn>=0.12.0",
    "scipy>=1.7.0",
    "statsmodels>=0.13.0",
    "pandas>=1.3.0",
    "build",
    "twine",
]

[project.scripts]
dva-lab = "dva_lab.cli:main"
dvalab = "dva_lab.cli:main"

[project.urls]
Homepage = "https://github.com/AnandChowdari/dva-lab"
Repository = "https://github.com/AnandChowdari/dva-lab.git"
Issues = "https://github.com/AnandChowdari/dva-lab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dva_lab" = ["data/*.csv", "index.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
